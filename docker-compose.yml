services:
  postgres:
    image: postgres:16-alpine
    container_name: storesync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: storesync
      POSTGRES_USER: storesync
      POSTGRES_PASSWORD: storesync_dev
    ports:
      - "5432:5432"
    volumes:
      - storesync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storesync -d storesync"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Penyimpanan berkas S3-compatible untuk lokal (produksi memakai Cloudflare R2).
  minio:
    image: minio/minio:latest
    container_name: storesync-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: storesync
      MINIO_ROOT_PASSWORD: storesync_dev
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - storesync_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    container_name: storesync-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 storesync storesync_dev &&
      mc mb --ignore-existing local/storesync
      "

volumes:
  storesync_postgres_data:
  storesync_minio_data:
